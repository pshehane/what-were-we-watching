<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.80 0.14 72); text-decoration: none; }
    a:hover { color: oklch(0.88 0.12 78); }
    button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: oklch(0.17 0.012 65); color: oklch(0.95 0.011 85); font-family: 'Space Grotesk', system-ui, sans-serif;">

  <!-- space the real Android status bar occupies -->
  <div style="height: 44px;"></div>

  <div style="display: flex; flex-direction: column; gap: 0; padding: 0 18px;">

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 30px; font-weight: 400; line-height: 1.1; letter-spacing: -0.01em;">Who&rsquo;s on the couch?</h1>
      <div style="display: flex; flex-shrink: 0; margin-right: -10px;">
        <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" aria-label="Search">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.012 75)" stroke-width="1.7" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 L21 21"></path>
          </svg>
        </button>
        <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" aria-label="Services and profiles">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="oklch(0.70 0.012 75)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M12 3.2 L12 5.6 M12 18.4 L12 20.8 M3.2 12 L5.6 12 M18.4 12 L20.8 12 M5.8 5.8 L7.5 7.5 M16.5 16.5 L18.2 18.2 M18.2 5.8 L16.5 7.5 M7.5 16.5 L5.8 18.2"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- the couch bar: tap a face to seat or unseat them -->
    <div style="display: flex; gap: 12px; padding: 12px 0 10px;">
      <sc-for list="{{crew}}" as="p" hint-placeholder-count="4">
        <button onClick="{{p.toggle}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 56px;">
          <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; letter-spacing: 0.02em; {{p.avatarStyle}}">{{p.initial}}</div>
          <div style="font-size: 11px; letter-spacing: 0.01em; {{p.nameStyle}}">{{p.name}}</div>
        </button>
      </sc-for>
    </div>

    <div style="font-size: 13px; line-height: 1.45; color: oklch(0.70 0.012 75); padding-bottom: 10px; border-bottom: 1px solid oklch(0.26 0.011 65);">{{summary}}</div>

  </div>

  <!-- results -->
  <div style="display: flex; flex-direction: column; padding: 14px 18px 0;">

    <sc-if value="{{hasPrimary}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: center; gap: 8px; padding-bottom: 2px;">
          <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.80 0.14 72);">{{primaryLabel}}</span>
          <span style="flex-grow: 1; height: 1px; background: oklch(0.26 0.011 65);"></span>
        </div>

        <sc-for list="{{primary}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px; align-items: center; background: oklch(0.225 0.013 65); border: 1px solid oklch(0.29 0.011 65); border-radius: 15px; padding: 9px;">

            <div style="width: 52px; height: 72px; border-radius: 8px; flex-shrink: 0; position: relative; overflow: hidden; background: {{s.p1}};">
              <div style="position: absolute; width: 46px; height: 46px; border-radius: 50%; left: 13px; top: 9px; background: {{s.p2}};"></div>
              <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; font-family: 'Instrument Serif', Georgia, serif; font-size: 10px; line-height: 1.1; color: oklch(0.97 0.01 85); background: linear-gradient(transparent, rgba(0,0,0,0.55));">{{s.title}}</div>
            </div>

            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
              <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; line-height: 1.05; letter-spacing: -0.005em;">{{s.title}}</div>

              <!-- where to go: the service, then the profile to pick once you are there -->
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-weight: 700; color: oklch(0.80 0.14 72); font-size: 12.5px;">{{s.pos}}</span>
                <span style="display: inline-flex; align-items: center; height: 19px; border-radius: 5px; overflow: hidden; {{s.pillOuter}}">
                  <span style="padding: 0 5px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; line-height: 19px; {{s.pillLeft}}">{{s.svc}}</span>
                  <span style="padding: 0 6px 0 5px; font-size: 10.5px; line-height: 19px; {{s.pillRight}}">{{s.prof}}</span>
                </span>
              </div>

              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="display: flex;">
                  <sc-for list="{{s.dots}}" as="d" hint-placeholder-count="4">
                    <div style="width: 17px; height: 17px; border-radius: 50%; margin-right: -5px; border: 1.5px solid oklch(0.225 0.013 65); display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; color: oklch(0.17 0.012 65); background: {{d.color}};">{{d.initial}}</div>
                  </sc-for>
                </div>
                <span style="font-size: 11px; color: oklch(0.55 0.010 75); padding-left: 6px;">{{s.ago}}</span>
              </div>
            </div>

            <button style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid oklch(0.45 0.09 72); color: oklch(0.80 0.14 72); font-size: 13px; font-weight: 700; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">+1</button>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hasSecondary}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px;">
        <div style="display: flex; align-items: center; gap: 8px; padding-bottom: 2px;">
          <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; color: oklch(0.80 0.14 235);">{{secondaryLabel}}</span>
          <span style="flex-grow: 1; height: 1px; background: oklch(0.26 0.011 65);"></span>
        </div>

        <sc-for list="{{secondary}}" as="s" hint-placeholder-count="2">
          <div style="display: flex; gap: 11px; align-items: center; border: 1px solid oklch(0.25 0.011 65); border-radius: 13px; padding: 7px 10px;">
            <div style="width: 36px; height: 50px; border-radius: 6px; flex-shrink: 0; position: relative; overflow: hidden; background: {{s.p1}};">
              <div style="position: absolute; width: 32px; height: 32px; border-radius: 50%; left: 9px; top: 6px; background: {{s.p2}};"></div>
            </div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; line-height: 1.05; color: oklch(0.88 0.011 85);">{{s.title}}</div>
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="font-size: 11.5px; color: oklch(0.68 0.010 75);">{{s.pos}}</span>
                <span style="display: inline-flex; align-items: center; height: 17px; border-radius: 4px; overflow: hidden; {{s.pillOuter}}">
                  <span style="padding: 0 4px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; line-height: 17px; {{s.pillLeft}}">{{s.svc}}</span>
                  <span style="padding: 0 5px 0 4px; font-size: 9.5px; line-height: 17px; {{s.pillRight}}">{{s.prof}}</span>
                </span>
              </div>
              <div style="font-size: 11px; color: oklch(0.80 0.14 235);">{{s.note}}</div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.45 0.010 75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 5 L16 12 L9 19"></path></svg>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <!-- fade + bottom bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 84px; height: 44px; background: linear-gradient(transparent, oklch(0.17 0.012 65)); pointer-events: none;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: oklch(0.195 0.012 65); border-top: 1px solid oklch(0.27 0.011 65); display: flex; align-items: center; justify-content: space-between; padding: 0 26px 18px;">
    <button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; height: 48px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.14 72)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 A2 2 0 0 1 7 12 L7 15 L17 15 L17 12 A2 2 0 0 1 21 12 L21 18 L3 18 Z"></path><path d="M5.5 10.5 L5.5 8 A2 2 0 0 1 7.5 6 L16.5 6 A2 2 0 0 1 18.5 8 L18.5 10.5"></path></svg>
      <span style="font-size: 10px; color: oklch(0.80 0.14 72);">Couch</span>
    </button>

    <button style="width: 60px; height: 60px; border-radius: 50%; background: oklch(0.80 0.14 72); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.45);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(0.17 0.012 65)" stroke-width="2.4" stroke-linecap="round"><path d="M12 5 L12 19"></path><path d="M5 12 L19 12"></path></svg>
    </button>

    <button style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; height: 48px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.60 0.010 75)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5" rx="1.2"></rect><path d="M4.8 8.5 L4.8 19 L19.2 19 L19.2 8.5"></path><path d="M10 12.5 L14 12.5"></path></svg>
      <span style="font-size: 10px; color: oklch(0.60 0.010 75);">Shelf</span>
    </button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CREW = [
  { id: 'A', name: 'Ana', color: 'oklch(0.80 0.13 40)' },
  { id: 'B', name: 'Ben',   color: 'oklch(0.80 0.13 345)' },
  { id: 'C', name: 'Cal',   color: 'oklch(0.80 0.13 205)' },
  { id: 'D', name: 'Dee',   color: 'oklch(0.80 0.13 145)' }
];

/* one tint per service drives the whole service+profile badge */
const SERVICE_TINT = {
  'NETFLIX':   'oklch(0.68 0.17 25)',
  'MAX':       'oklch(0.70 0.15 290)',
  'HULU':      'oklch(0.80 0.18 150)',
  'DISNEY+':   'oklch(0.70 0.13 255)',
  'PRIME':     'oklch(0.76 0.11 225)',
  'APPLE TV+': 'oklch(0.84 0.008 85)'
};

const SHOWS = [
  { title: 'Arcane',        w: 'ABCD', svc: 'NETFLIX',   prof: 'Kids',      pos: 'S2 · E5',  days: 2,  p1: 'oklch(0.34 0.09 300)', p2: 'oklch(0.72 0.13 195)' },
  { title: 'Severance',     w: 'ABCD', svc: 'APPLE TV+', prof: 'Family',    pos: 'S2 · E4',  days: 6,  p1: 'oklch(0.33 0.05 245)', p2: 'oklch(0.75 0.11 95)' },
  { title: 'The Bear',      w: 'ABCD', svc: 'HULU',      prof: 'Dad',       pos: 'S3 · E2',  days: 21, p1: 'oklch(0.30 0.04 60)',  p2: 'oklch(0.70 0.14 35)' },
  { title: 'Shōgun',        w: 'AB',   svc: 'HULU',      prof: 'Dad',       pos: 'S1 · E6',  days: 9,  p1: 'oklch(0.31 0.05 20)',  p2: 'oklch(0.74 0.12 65)' },
  { title: 'Fallout',       w: 'AC',   svc: 'PRIME',     prof: 'Household', pos: 'S1 · E3',  days: 34, p1: 'oklch(0.34 0.06 130)', p2: 'oklch(0.76 0.13 90)' },
  { title: 'Bluey',         w: 'BD',   svc: 'DISNEY+',   prof: 'Kids',      pos: 'S3 · E22', days: 1,  p1: 'oklch(0.38 0.08 250)', p2: 'oklch(0.80 0.11 60)' },
  { title: 'Gravity Falls', w: 'CD',   svc: 'DISNEY+',   prof: 'Kids',      pos: 'S1 · E9',  days: 4,  p1: 'oklch(0.33 0.06 155)', p2: 'oklch(0.74 0.12 75)' },
  { title: 'Slow Horses',   w: 'A',    svc: 'APPLE TV+', prof: 'Dad',       pos: 'S4 · E2',  days: 2,  p1: 'oklch(0.29 0.03 250)', p2: 'oklch(0.68 0.09 140)' }
];

function nameList(ids) {
  const names = ids.map(function (id) {
    const c = CREW.find(function (x) { return x.id === id; });
    return c ? c.name : id;
  });
  if (names.length === 1) return names[0];
  if (names.length === 2) return names[0] + ' & ' + names[1];
  return names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
}

function ago(d) {
  if (d === 1) return 'yesterday';
  if (d < 14) return d + ' days ago';
  if (d < 60) return Math.round(d / 7) + ' weeks ago';
  return Math.round(d / 30) + ' months ago';
}

function pill(svc) {
  const tint = SERVICE_TINT[svc] || 'oklch(0.70 0.012 75)';
  return {
    pillOuter: 'border: 1px solid ' + tint + ';',
    pillLeft: 'background: ' + tint + '; color: oklch(0.17 0.012 65);',
    pillRight: 'color: ' + tint + ';'
  };
}

class Component extends DCLogic {
  renderVals() {
    const self = this;
    const on = (this.state && this.state.on) || { A: true, B: true, C: true, D: true };
    const seated = CREW.filter(function (c) { return on[c.id]; }).map(function (c) { return c.id; });

    const crew = CREW.map(function (c) {
      const isOn = !!on[c.id];
      return {
        id: c.id,
        name: c.name,
        initial: c.name.charAt(0),
        avatarStyle: isOn
          ? 'background: ' + c.color + '; color: oklch(0.17 0.012 65); box-shadow: 0 0 0 2px oklch(0.17 0.012 65), 0 0 0 3.5px ' + c.color + ';'
          : 'background: oklch(0.225 0.013 65); color: oklch(0.45 0.010 75); border: 1px dashed oklch(0.33 0.011 65);',
        nameStyle: isOn ? 'color: oklch(0.92 0.011 85);' : 'color: oklch(0.44 0.010 75);',
        toggle: function () {
          const next = Object.assign({}, on);
          next[c.id] = !next[c.id];
          self.setState({ on: next });
        }
      };
    });

    function dotsFor(w) {
      return w.split('').map(function (id) {
        const c = CREW.find(function (x) { return x.id === id; });
        return { initial: id, color: c ? c.color : '#888' };
      });
    }

    const primary = [];
    const secondary = [];

    SHOWS.forEach(function (s) {
      const watchers = s.w.split('');
      const matched = seated.filter(function (id) { return watchers.indexOf(id) !== -1; });
      if (matched.length === 0) return;

      const base = Object.assign({
        title: s.title, pos: s.pos, svc: s.svc, prof: s.prof, days: s.days,
        p1: s.p1, p2: s.p2, ago: ago(s.days), dots: dotsFor(s.w)
      }, pill(s.svc));

      if (matched.length === seated.length) {
        primary.push(base);
      } else {
        const missing = seated.filter(function (id) { return watchers.indexOf(id) === -1; });
        secondary.push(Object.assign({}, base, {
          matchCount: matched.length,
          note: 'for ' + nameList(matched) + ' — not ' + nameList(missing)
        }));
      }
    });

    primary.sort(function (a, b) { return a.days - b.days; });
    secondary.sort(function (a, b) { return (b.matchCount - a.matchCount) || (a.days - b.days); });

    let summary;
    if (seated.length === 0) {
      summary = 'Nobody seated. Tap a face above and the list fills in.';
    } else {
      summary = nameList(seated) + ' — ' + primary.length + ' you are all part-way through, ' +
        secondary.length + ' that only some of you are on.';
    }

    return {
      crew: crew,
      summary: summary,
      hasPrimary: primary.length > 0,
      hasSecondary: secondary.length > 0,
      primaryLabel: (seated.length === 1 ? 'ON YOUR OWN' : 'ALL OF YOU') + ' · ' + primary.length,
      secondaryLabel: 'SOME OF YOU · ' + secondary.length,
      primary: primary.slice(0, 4),
      secondary: secondary.slice(0, 2)
    };
  }
}
</script>
</body>
</html>
